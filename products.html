<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Products Management</title>



<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:10px;
}

.header h1 {
    color: #696868;
    font-weight: 400;
}

.btn{
padding:10px 16px;
text-decoration:none;
background:#eb9525;
color:white;
border-radius:8px;
}

.add{
background:#929292;
color: #ffffff;
margin: 10px;
}

.toolbar{
margin-bottom:20px;
}

.toolbar input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
}

.table-wrapper{
background:white;
border-radius:12px;
overflow:auto;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

table{
width:100%;
border-collapse:collapse;
}

th,
td{
padding:14px;
text-align:left;
border-bottom:1px solid #eee;
}

.action-btn{
border:none;
padding:8px 12px;
cursor:pointer;
border-radius:6px;
margin-right:5px;
}

.edit-btn{
    color: rgb(93, 94, 93);
    padding: 10px;
    background-color: white;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid rgb(0, 153, 255);
}

.delete-btn{
    color: red;
    padding: 10px;
    background-color: white;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid rgb(255, 102, 0);
}

.delete-btn, .edit-btn {
    display: n;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
justify-content:center;
align-items:center;
}

.modal.show{
display:flex;
}

.modal-content{
background:white;
padding:20px;
width:95%;
max-width:500px;
border-radius:12px;
}

.modal-content input{
width:100%;
padding:12px;
margin-bottom:12px;
}

.modal-actions{
display:flex;
gap:10px;
}

.modal-actions button{
flex:1;
padding:12px;
cursor:pointer;
}

/* ========================================
   VIEW BUTTON
======================================== */

.view-btn{

    border:none;

    background:#ececec;

    color:rgb(199, 105, 29);

    width:40px;

    height:40px;

    border-radius:10px;

    cursor:pointer;

}

.view-btn:hover{

    transform:scale(1.05);

}

/* ========================================
   ACTION MODAL
======================================== */

.action-modal{

    width:95%;

    max-width:450px;

    animation:
        dropDown .35s ease;

}

.product-details{

    margin:20px 0;

}

.product-details p{

    padding:12px 0;

    border-bottom:
        1px solid #eee;

}

.action-buttons{

    display:flex;

    gap:10px;

}

.action-buttons button{

    flex:1;

    border:none;

    padding:14px;

    border-radius:10px;

    cursor:pointer;

    font-weight:600;

}

#editProductBtn{

    background:#ffffff;

    color:rgb(33, 172, 142);

}

#deleteProductBtn{

    background:#ffffff;

    color:rgb(212, 56, 56);

}
.klozbat{

    display: flex;
    padding: 10px;
    justify-content: right;
    align-items: center;
    margin-top: 10px;
    border-bottom:1px solid #dadada;
}
#closeActionModal{
    background-color: #ffffff;
    color: #eb9525;
    padding: 5px;
    border: none;
    border-radius: 2px;
    cursor: pointer;
}

@keyframes dropDown{

    from{

        transform:
            translateY(-80px);

        opacity:0;

    }

    to{

        transform:
            translateY(0);

        opacity:1;

    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>

            Product Management

        </h1>

        <div>

            <a
                href="addprods.html"
                class="btn add">

                <i class="fas fa-plus"></i>

                Add Product

            </a>

            <a
                href="index.html"
                class="btn">

                Back To POS

            </a>

        </div>

    </div>

    <div class="toolbar">

        <input
            type="text"
            id="productSearch"
            placeholder="Search products...">

    </div>

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>Name</th>

                    <th>Category</th>

                    <th>Cost</th>

                    <th>Price</th>

                    <th>Stock</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="productsTableBody">

            </tbody>

        </table>

    </div>

</div>

<!-- EDIT MODAL -->

<div
    class="modal"
    id="editModal">

    <div class="modal-content">

        <h2>

            Edit Product

        </h2>

        <input
            type="hidden"
            id="editId">

        <input
            type="text"
            id="editName"
            placeholder="Product Name">

        <input
            type="text"
            id="editCategory"
            placeholder="Category">

        <input
            type="number"
            id="editCostPrice"
            placeholder="Cost Price">

        <input
            type="number"
            id="editSellingPrice"
            placeholder="Selling Price">

        <input
            type="number"
            id="editStock"
            placeholder="Stock">

        <div class="modal-actions">

            <button
                id="saveEditBtn">

                Save

            </button>

            <button
                id="closeModalBtn">

                Cancel

            </button>

        </div>

    </div>

</div>

<!-- PRODUCT ACTION MODAL -->

<div
    class="modal"
    id="productActionModal">

    <div class="modal-content action-modal">

        <div class="modal-header">

            <h2 id="actionProductName">

                Product

            </h2>

         
            <div class="klozbat">   
                
                <button
                id="closeActionModal">

                x

            </button>
        </div>

        </div>

        <div class="product-details">

            <p>

                <strong>Category:</strong>

                <span id="actionCategory"></span>

            </p>

            <p>

                <strong>Cost Price:</strong>

                <span id="actionCost"></span>

            </p>

            <p>

                <strong>Selling Price:</strong>

                <span id="actionPrice"></span>

            </p>

            <p>

                <strong>Stock:</strong>

                <span id="actionStock"></span>

            </p>

        </div>

        <div class="action-buttons">

            <button
                id="editProductBtn">

                <i class="fas fa-pen"></i>

                Edit

            </button>

            <button
                id="deleteProductBtn">

                <i class="fas fa-trash"></i>

                Delete

            </button>

        </div>

    </div>

</div>
<script src="JS/auth.js"></script>
<script src="JS/products-page.js"></script>

</body>
</html>
