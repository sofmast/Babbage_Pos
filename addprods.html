
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Add Product</title>

<link
rel="stylesheet"
href="CSS/add-products.css">

</head>

<body>

<div class="container">

    <div class="card">

        <!-- HEADER -->

        <div class="header">

            <div>

                <h1>
                    Add Product
                </h1>

                <p>
                    Create a new inventory item
                </p>

            </div>

            <a href="index.html">

                Back To POS

            </a>

        </div>

        <!-- PROGRESS BAR -->

        <div class="progress-wrapper">

            <div class="progress-line">

                <div
                    id="progressFill"
                    class="progress-fill">

                </div>

            </div>

            <div class="steps-nav">

                <div class="nav-step active">

                    <span>1</span>

                    <small>Product</small>

                </div>

                <div class="nav-step">

                    <span>2</span>

                    <small>Pricing</small>

                </div>

                <div class="nav-step">

                    <span>3</span>

                    <small>Stock</small>

                </div>

                <div class="nav-step">

                    <span>4</span>

                    <small>Review</small>

                </div>

            </div>

        </div>

        <!-- FORM -->

        <form id="productForm">

            <div class="form-stage">

                <!-- STEP 1 -->

                <div class="step active">

                    <h2>
                        Product Information
                    </h2>

                    <div class="form-group">

                        <label>

                            Product Name

                        </label>

                        <input
                            type="text"
                            id="productName"
                            placeholder="Enter product name"
                            required>

                    </div>

                    <div class="form-group">

                        <label>

                            Category

                        </label>

                        <input
                            type="text"
                            id="productCategory"
                            placeholder="Enter category"
                            required>

                    </div>

                </div>

                <!-- STEP 2 -->

                <div class="step">

                    <h2>
                        Pricing Information
                    </h2>

                    <div class="form-group">

                        <label>

                            Cost Price

                        </label>

                        <input
                        type="text"
                        id="costPrice"
                        placeholder="0.00"
                        step="0.01">

                    </div>

                    <div class="form-group">

                        <label>

                            Selling Price

                        </label>

                        <input
                            type="text"
                            id="sellingPrice"
                            placeholder="0.00"
                            step="0.01">

                    </div>

                    <div class="profit-card">

                        <div class="profit-item">

                            <span>

                                Profit Per Unit

                            </span>

                            <h3 id="profitAmount">

                                K0.00

                            </h3>

                        </div>

                        <div class="profit-item">

                            <span>

                                Profit Margin

                            </span>

                            <h3 id="profitMargin">

                                0%

                            </h3>

                        </div>

                    </div>

                </div>

                <!-- STEP 3 -->

                <div class="step">

                    <h2>
                        Stock Information
                    </h2>

                    <div class="form-group">

                        <label>

                            Opening Stock Quantity

                        </label>

                        <input
                            type="number"
                            id="stockQty"
                            placeholder="Enter quantity"
                            required>

                    </div>

                </div>

                <!-- STEP 4 -->

                <div class="step">

                    <h2>
                        Product Review
                    </h2>

                    <div class="form-group">

                        <label>

                            Product Image URL

                        </label>

                        <input
                            type="text"
                            id="productImage"
                            placeholder="https://example.com/image.jpg">

                    </div>

                    <div class="image-preview">

                        <img
                            id="previewImage"
                            src="images/noimage.webp"
                            alt="Product Preview" width="120px">

                    </div>

                    <div class="review-card">

                        <h3
                            style="
                            margin-bottom:15px;
                            color:#0f172a;">

                            Product Summary

                        </h3>

                        <div id="reviewContent">

                        </div>

                    </div>

                </div>

            </div>

            <!-- ACTION BUTTONS -->

            <div class="form-actions">

                <button
                    type="button"
                    id="prevBtn">

                    Previous

                </button>

                <button
                    type="button"
                    id="nextBtn">

                    Next

                </button>

                <button
                    type="submit"
                    id="submitBtn">

                    Save Product

                </button>

            </div>

        </form>

        <!-- SUCCESS TOAST -->

        <div
            id="toast"
            class="toast">

        </div>

    </div>

</div>
<script src="JS/auth.js"></script>
<script src="JS/apro.js"></script>

</body>

</html>
